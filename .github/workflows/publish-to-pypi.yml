name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    tags:
      - '*'

jobs:
  build:
    uses: exordos/exordos_ci/.github/workflows/python_dist.yml@master

  # PyPI rejects trusted publishing from a reusable workflow, so this job
  # stays here.
  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/exordos_notification
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs:
    - publish-to-pypi
    uses: exordos/exordos_ci/.github/workflows/python_release.yml@master
    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore
