name: build

on:
  push:
    branches-ignore:
      - master
    tags:
      - '*'

jobs:
  Build:
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: exordos/exordos_ci/.github/workflows/element_build.yml@master
    secrets:
      PUSH_CFG: ${{ secrets.PUSH_CFG }}
  Test:
    needs: Build
    uses: exordos/exordos_ci/.github/workflows/element_realm_test.yml@master
    with:
      elements: exordos_notification notification_site_config_example
      version: ${{ needs.Build.outputs.version }}
      dependencies: metapaas dbaas mailaas
      overbook: true
    secrets: inherit
